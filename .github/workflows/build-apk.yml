name: Build ApkStudio APK

on:
  push:
    branches: ["arena/01a0aabc-apkstudio", "main"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    if: github.event_name == 'workflow_dispatch' || !contains(github.event.head_commit.message, '[skip ci]')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build Debug APK
        run: chmod +x gradlew && ./gradlew assembleDebug --stacktrace --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ApkStudio-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      - name: Commit APK to release folder
        run: |
          mkdir -p release
          cp app/build/outputs/apk/debug/app-debug.apk release/ApkStudio-debug.apk
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f release/ApkStudio-debug.apk
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Build ApkStudio debug APK [skip ci]"
            git pull --rebase origin "${GITHUB_REF_NAME}" || true
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi

      - name: Save build log on failure
        if: failure()
        run: |
          mkdir -p release
          tail -c 200000 build-output.txt > release/last-build-log.txt || true
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f release/last-build-log.txt
          git commit -m "Save build log [skip ci]" || echo "nothing to commit"
          git pull --rebase origin "${GITHUB_REF_NAME}" || true
          git push origin "HEAD:${GITHUB_REF_NAME}" || true
