name: Publish APK Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v1.0.0)'
        required: true
        default: 'v1.0.0'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create release and upload APK
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          echo "Publishing $TAG"
          ls -la release/
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" \
              --title "ApkStudio $TAG" \
              --notes "ApkStudio $TAG: import an Android ZIP, push it to GitHub, build it in the cloud with GitHub Actions, and download the Debug APK. Setup: create a personal access token with repo + workflow scopes and link it inside the app."
          fi
          gh release upload "$TAG" release/ApkStudio-debug.apk --clobber
          gh release view "$TAG"
